            border-radius: 10px;

            color: white;

            padding: 25px;
            background-color: #FFF0F6;

            width: 120px;
            height: 120px;

            font-weight: 700;
        }

        #userResult p {
            margin: 8px 0;
        }

        footer {

        @media (max-width: 768px) {

            .navbar-nav .nav-link {

            .github-section {
                margin: 50px auto;

            .section-title {

<body>

        <div class="container">

                    <li class="nav-item">

 <main>
        <section class="github-section">
            <div class="text-center">

                <h1 class="section-title">
                    GitHub User Lookup
                </h1>

                <p class="description">
                    Search for a GitHub user and view their basic profile information.
                </p>

            </div>

            <div class="mt-5">

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Enter GitHub Username"
                >

            </div>

            <div class="mt-3">

                <button
                    onclick="getUser()"
                    class="btn btn-pau">
                    Get User
                </button>
            </div>

            <div id="userResult"></div>
        </section>
    </main>
    <footer class="py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1">
               © Pau's Corner ♡ | Web Systems
            </p>
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        function getUser() {
            let username = document.getElementById("username").value.trim();
            if (username===""){
                document.getElementById("userResult").innerHTML=
                "Please enter your Github username:"
                return;
            }
            let url = `https://api.github.com/users/${username}`;
            document.getElementById("userResult").innerHTML=
            "Loading Github profile...";
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                if (data.message === "Not Found"){
                   document.getElementById("userResult").innerHTML = "Oops! Github user not found. Please check the username:"
                   return;
                    }

                    document.getElementById("userResult").innerHTML = `
                       <h3>${data.name || "No Name Found"}</h3>
                       <img src="${data.avatar_url}"
                            alt="GitHub profile picture"> <p>
                        <strong>Username:</strong>
                            ${data.login}
                        </p>
                        <p>    
                        <strong>Public Repos:</strong> ${data.public_repos} </p>
                       <strong>Followers:</strong>${data.followers} </p>
                    `;
                })
                .catch(error => console.error("Error fetching GitHub data:", error

                ));
        }
        </script>
    </body>
