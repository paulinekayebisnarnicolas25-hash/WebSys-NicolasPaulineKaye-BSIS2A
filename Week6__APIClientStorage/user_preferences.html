    <style>

            margin:0;
            padding:0;
            width:100%;

        }

            color:#3A2930;

            transition: 0.3s ease;

        }

        .navbar-brand {

        .navbar-nav .nav-link {

        }
        .section-title {
            color: #8B3A62;

        }
        .description {
            color: #6F6268;
        }
         .form-label {
            color: #3A2930;
            font-weight: 600;
        }
        .form-select {
            border: 1px solid #D8B8C6;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
        }
        .form-select:focus {
            border-color: #8B3A62;
            box-shadow: 0 0 0 0.2rem rgba(139, 58, 98, 0.15);
        }
        .btn-pau {
            background-color: #8B3A62;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 25px;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .btn-pau:hover {
            background-color: #6F2D4E;
            color: white;
            transform: translateY(-2px);
        }
        #message {
            min-height: 45px;
            margin-top: 25px;
            padding: 12px;
            background-color: #FFF0F6;
            color: #8B3A62;
            border-radius: 10px;
            font-weight: 600;
        }

        body.dark-mode { background-color: #181216; color: white; }
        body.dark-mode .navbar-custom { background-color: #4D2037;}
        body.dark-mode .preferences-card {background-color: #222;border-color: #5A3948;}
         body.dark-mode .section-title {
            color: #F7D6E5;
        }
         body.dark-mode .description {
            color: #D8C9D0;
        }
        body.dark-mode .form-label {
            color: white;
        }
         body.dark-mode .form-select {
            background-color: #333;
            color: white;
            border-color: #666;
        }
         body.dark-mode #message {
            background-color: #4D3040;
            color: #F7D6E5;
        }
           body.dark-mode footer {
            background-color: #4D2037;
        }
         footer {
            background-color: #8B3A62;
            color: white;
        }

         @media (max-width: 768px) {
            .navbar-brand {
                font-size: 18px;
            }
            .navbar-nav {
                padding-top: 10px;
            }
            .navbar-nav .nav-link {
                padding: 8px 0;
            }
            .preferences-section {
                margin: 40px auto;
            }
            .preferences-card {
                padding: 25px 20px;
            }
            .section-title {
                font-size: 28px;
            }
            .preferences-icon {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>

            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

    <main class="container">
    <div class="preferences-section"> 
    <div class="preferences-card text-center">
    <h1 class="section-title mt-3">  Choose Your Preferences</h1>
     <p class="description">
    Come and Personalize!</p>
    <div class="text-start mt-4">
    <label
        for="theme"
        class="form-label"> Theme: </label>
<select
    id="theme" 
    class="form-select">
    <option value="light"> Light Mode </option> 
    <option value="dark">Dark Mode</option>
</select>
</div>
 
   
<div class="text-start mt-4">
    <label 
        for="language"
        class="form-label"> Language </label>
        <select id="language" class="form-select">
        <option value="en">English</option>
        <option value="es">Spanish</option>
    </select>
    </div>
 
    <button onclick="savePreferences()"
    class="btn btn-pau mt-4">Save Preferences</button>
     <p id="message"></p>
        </div>
    </section>
</main>
<footer class="py-4 mt-5">
    <div class="container text-center">
    <p class="mb-1"> © Pau's Corner ♡ | Web Systems </p>
    </div>
    </footer>

     <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        function savePreferences() {
           let theme = document.getElementById("theme").value;
           let language = document.getElementById("language").value;
           localStorage.setItem("theme", theme);
           localStorage.setItem("language", language);
           applyPreferences();
           document.getElementById("message").innerText = "Preferences Saved! ♡";
        }
 
        function applyPreferences() {
            let savedTheme = localStorage.getItem("theme");
            let savedLanguage = localStorage.getItem("language");
            
            if (savedTheme === "dark") {
               document.body.classList.add("dark-mode");
            } else {
               document.body.classList.remove("dark-mode");
            }
 
           document.getElementById("theme").value = savedTheme || "light";
           document.getElementById("language").value = savedLanguage || "en";
        }
 
        applyPreferences();
    </script>
