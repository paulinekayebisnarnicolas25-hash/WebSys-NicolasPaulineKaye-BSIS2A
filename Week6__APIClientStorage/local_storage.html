<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pau's Corner ♡ | Local Storage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"><script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
        font-family: 'Poppins', sans-serif;
        background-color: #FFF9FB;
        color: #3A2930;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        }

        main {
         flex: 1;
        }

        .navbar-custom {
            background-color: #8B3A62;
        }
        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }
        .navbar-nav .nav-link {
            color: white !important;
            font-weight: 500;
        }
        .navbar-nav .nav-link:hover {
            color: #F7D6E5 !important;
        }
        .navbar-toggler {
            border-color: #F7D6E5;
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        .storage-section {
            width: 100%;
            max-width: 650px;
            margin: 70px auto;
            padding: 0 15px;
        }

        .storage-card {
            width: 100%;
            background-color: white;
            border: 1px solid #F7D6E5;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 20px rgba(139, 58, 98, 0.12);
        }

        .storage-icon {
            font-size: 50px;
        }

        .section-title {
            color: #8B3A62;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #D8B8C6;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
        }

        .form-control:focus {
            border-color: #8B3A62;
            box-shadow: 0 0 0 0.2rem rgba(139, 58, 98, 0.2);
        }

        .btn-pau {
            background-color: #8B3A62;
            color: white;
            border-radius: 8px;
            padding: 10px 20px;
            border: none;
        }

        .btn-pau:hover {
            background-color: #6F2D4E;
            color: white;
        }

        .btn-light-pink {
            background-color: #F7D6E5;
            color: #8B3A62;
            border-radius: 8px;
            padding: 10px 20px;
            border: none;
        }

        .btn-light-pink:hover {
            background-color: #EABFD2;
            color: #6F2D4E;
        }

        #display {
            min-height: 45px;
            margin-top: 25px;
            padding: 12px;
            background-color: #FFF0F6;
            color: #8B3A62;
            border-radius: 10px;
            font-weight: 600;
        }

        footer {
            background-color: #8B3A62;
            color: white;
        }
        

        @media (max-width: 768px) {

            .navbar-brand {
                font-size: 18px;
            }

            .navbar-nav {
                padding-top: 10px;
            }

            .navbar-nav .nav-link {
                padding: 8px 0;
            }

            .storage-section {
                margin: 40px auto;
            }

            .storage-card {
                padding: 25px 20px;
            }

            .section-title {
                font-size: 28px;
            }

            .storage-icon {
                font-size: 42px;
            }

        }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Pau's Corner </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>

            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">
                            Weather API
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="github_api.html">
                            GitHub API
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main>
        <section class="storage-section">
                <h1 class="section-title mt-3">
                    Save User Preferences
                </h1>
                <p class="text-muted">
                    Try saving your name using browser Local Storage. </p>

                <div class="text-start mt-4">

                    <label
                        for="username"
                        class="form-label fw-semibold">
                        Enter Name:
                    </label>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your name">

                </div>

                <div class="d-flex justify-content-center gap-2 mt-4 flex-wrap">
                    <button
                        onclick="saveData()"
                        class="btn btn-pau">
                        Save
                    </button>
                    <button
                        onclick="loadData()"
                        class="btn btn-light-pink">
                        Load
                    </button>
                </div>

                <p id="display"></p>
            </div>
        </section>
    </main>

    <footer class="py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1"> © Pau's Corner ♡ | Web Systems
            </p>
        </div>
    </footer>

    <script>
        function saveData() {
            let name =
                document.getElementById("username").value;
            localStorage.setItem("userName", name);
            alert("Data Saved!");
        }
        function loadData() {
            let name =
                localStorage.getItem("userName");
            document.getElementById("display").innerText =
                name
                    ? "Welcome, " + name
                    : "No data saved!";
        }

    </script>
</body>
</html>
